services:

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "${GRAFANA_ALLOW_SIGN_UP}"
      GF_LOG_MODE: "${GRAFANA_LOG_MODE}"
      GF_LOG_FILE: "/var/log/grafana/grafana.log"

    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./logs/grafana:/var/log/grafana

    #depends_on:
    #  - prometheus
    #  - loki
    #  - tempo

    networks:
      - observability


  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "${PROMETHEUS_PORT}:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=5GB"

    volumes:
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus

    networks:
      - observability


  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    restart: unless-stopped

    ports:
      - "${LOKI_PORT}:3100"

    command:
      - "-config.file=/etc/loki/loki.yml"

    volumes:
      - ./loki/config/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/data:/loki

    networks:
      - observability


  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    restart: unless-stopped

    ports:
      - "${TEMPO_HTTP_PORT}:3200"
      - "${TEMPO_OTLP_GRPC_PORT}:4317"
      - "${TEMPO_OTLP_HTTP_PORT}:4318"

    command:
      - "-config.file=/etc/tempo/tempo.yml"

    volumes:
      - ./tempo/config/tempo.yml:/etc/tempo/tempo.yml:ro
      - ./tempo/data:/var/tempo

    networks:
      - observability

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.1
    container_name: fluent-bit
    restart: unless-stopped
    
    volumes:
    - ./fluent-bit/config:/fluent-bit/etc:ro
    - ./fluent-bit/data:/fluent-bit/data
    - ./logs:/var/log/apps:ro
    - /mnt/docker/containers:/var/lib/docker/containers:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - loki
      
    networks:
      - observability

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--store_container_labels=false"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability

networks:
  observability:
    name: observability
    driver: bridge