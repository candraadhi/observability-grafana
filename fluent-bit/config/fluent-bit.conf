[SERVICE]
    Flush           1
    Log_Level       info
    Parsers_File    parsers.conf
    storage.path    /fluent-bit/data

# ============================================================
# Docker container stdout/stderr
# ============================================================

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker.*
    DB                /fluent-bit/data/docker.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Read_from_Head    Off



# ============================================================
# Grafana file log
# ============================================================

[INPUT]
    Name              tail
    Path              /var/log/apps/grafana/*.log
    Tag               file.grafana
    DB                /fluent-bit/data/grafana.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Read_from_Head    Off

# ============================================================
# Docker logs -> Loki
# ============================================================

[OUTPUT]
    Name        loki
    Match       docker.*
    Host        loki
    Port        3100
    Labels      job=docker,project=$attrs['com.docker.compose.project'],service=$attrs['com.docker.compose.service'],source=docker
    Line_Format json

# ============================================================
# Grafana file logs -> Loki
# ============================================================

[OUTPUT]
    Name        loki
    Match       file.grafana
    Host        loki
    Port        3100
    Labels      job=application,service=grafana,source=file
    Line_Format json

