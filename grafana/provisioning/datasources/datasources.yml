apiVersion: 1

datasources:

  - name: Prometheus
    uid: prometheus

    type: prometheus

    access: proxy

    url: http://prometheus:9090

    isDefault: true

    editable: true


  - name: Loki
    uid: loki

    type: loki

    access: proxy

    url: http://loki:3100

    editable: true

    jsonData:

      derivedFields:

        - name: TraceID

          matcherRegex: "trace_id[=: ]+([a-fA-F0-9]+)"

          datasourceUid: tempo

          url: "$${__value.raw}"


  - name: Tempo
    uid: tempo

    type: tempo

    access: proxy

    url: http://tempo:3200

    editable: true

    jsonData:

      tracesToLogs:

        datasourceUid: loki

        filterByTraceID: true
        filterBySpanID: true

        tags:
          - service.name
          - service.namespace
          - deployment.environment


      tracesToMetrics:

        datasourceUid: prometheus

        tags:
          - service.name
          - job

        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$__tags}[5m]))'


      serviceMap:
        datasourceUid: prometheus