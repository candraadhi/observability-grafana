global:
  scrape_interval: 15s
  evaluation_interval: 15s


scrape_configs:

  # Prometheus monitoring itself
  - job_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090


  # Loki metrics
  - job_name: loki

    static_configs:
      - targets:
          - loki:3100


  # Tempo metrics
  - job_name: tempo

    static_configs:
      - targets:
          - tempo:3200


  # Grafana metrics
  - job_name: grafana

    static_configs:
      - targets:
          - grafana:3000
  #cAdvisor metrics
  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets:
          - cadvisor:8080